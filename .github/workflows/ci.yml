name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  evidence-node18:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "18.20.8"
      - name: Pin npm compatibility version
        run: npm install --global npm@10.9.8
      - name: Assert minimum toolchain
        run: |
          test "$(node --version)" = "v18.20.8"
          test "$(npm --version)" = "10.9.8"
      - name: Evidence unit and conformance tests
        run: npm run test:evidence
      - name: Packed CLI and Playwright 1.42 smoke
        run: node tests/packed-evidence-smoke.mjs

  test:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      ZIG_VERSION: "0.16.0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: clients/go/go.mod
          cache: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version
      - name: Install tools
        run: |
          brew install kcov
          gem install xcodeproj
          case "$(uname -m)" in
            arm64) zig_arch="aarch64" ;;
            x86_64) zig_arch="x86_64" ;;
            *) echo "unsupported macOS architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -L -o zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-${zig_arch}-macos-${ZIG_VERSION}.tar.xz"
          tar -xf zig.tar.xz
          echo "$PWD/zig-${zig_arch}-macos-${ZIG_VERSION}" >> "$GITHUB_PATH"
          "$PWD/zig-${zig_arch}-macos-${ZIG_VERSION}/zig" version
      - name: Local CI gate
        run: ./scripts/ci-gate.sh
      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zmr-ci-artifacts
          path: |
            traces/
            zig-cache/coverage/
            zig-out/bin/zmr
          if-no-files-found: ignore
          retention-days: 14

  coverage-linux:
    # The macOS gate skips kcov (it can hang tracing child device-tool
    # processes), so the 90% floor was never actually enforced anywhere. Linux
    # runs kcov cleanly, so the gate lives here.
    #
    # 24.04 specifically: Zig emits DWARF 5, and kcov reads debug info through
    # libdw. 22.04 ships elfutils 0.186, whose DWARF 5 support is incomplete —
    # kcov runs the binary and reports 0 lines. 24.04 ships 0.190+.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ZIG_VERSION: "0.16.0"
      ZIG_TARGET: "native"
      ZMR_KCOV_TIMEOUT_SECONDS: "1200"
    steps:
      - uses: actions/checkout@v5
      - name: Install Zig
        run: |
          curl -L -o zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
          "$PWD/zig-x86_64-linux-${ZIG_VERSION}/zig" version
      - name: Build kcov
        # kcov is not packaged for 24.04 at all, and the 22.04 package (v38)
        # is too old to read current Zig debug info. Build it, so the gate does
        # not depend on what a runner image happens to ship.
        env:
          KCOV_VERSION: "v43"
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ binutils-dev libcurl4-openssl-dev \
            zlib1g-dev libdw-dev libiberty-dev libssl-dev ninja-build
          git clone --depth 1 --branch "$KCOV_VERSION" https://github.com/SimonKagstrom/kcov.git /tmp/kcov
          cmake -S /tmp/kcov -B /tmp/kcov/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/kcov/build
          sudo cmake --install /tmp/kcov/build
          kcov --version
      - name: Coverage gate
        run: ./scripts/coverage.sh
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zmr-coverage
          path: zig-cache/coverage/kcov
          if-no-files-found: ignore
          retention-days: 14
