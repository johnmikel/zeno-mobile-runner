name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      ZIG_VERSION: "0.15.2"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: clients/go/go.mod
          cache: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version
      - name: Install tools
        run: |
          brew install kcov
          gem install xcodeproj
          case "$(uname -m)" in
            arm64) zig_arch="aarch64" ;;
            x86_64) zig_arch="x86_64" ;;
            *) echo "unsupported macOS architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -L -o zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-${zig_arch}-macos-${ZIG_VERSION}.tar.xz"
          tar -xf zig.tar.xz
          echo "$PWD/zig-${zig_arch}-macos-${ZIG_VERSION}" >> "$GITHUB_PATH"
          "$PWD/zig-${zig_arch}-macos-${ZIG_VERSION}/zig" version
      - name: Local CI gate
        run: ./scripts/ci-gate.sh
      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zmr-ci-artifacts
          path: |
            traces/
            zig-cache/coverage/
            zig-out/bin/zmr
          if-no-files-found: ignore
          retention-days: 14
