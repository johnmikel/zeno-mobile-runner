name: Device Smoke

# Real-device evidence lane: boots an Android emulator and iOS simulator, then
# publishes the complete validated evidence root even when setup or smoke fails.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ZIG_VERSION: "0.16.0"
      ZMR_RUN_ID: device-smoke-android-${{ github.run_id }}-${{ github.run_attempt }}
      ZMR_RUN_EVIDENCE_ROOT: /tmp/zmr-android-demo/run-evidence/attempts/device-smoke-android-${{ github.run_id }}-${{ github.run_attempt }}
      ZMR_RUN_EVIDENCE_INDEX: /tmp/zmr-android-demo/run-evidence/attempt-index.json
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Initialize Android run evidence
        id: evidence_init
        run: |
          mkdir -p /tmp/zmr-android-demo/run-evidence/attempts
          context_json="$(python3 -c 'import json,os,platform; print(json.dumps({"runId":os.environ["ZMR_RUN_ID"],"executionId":"device-smoke-android-"+os.environ["GITHUB_RUN_ID"],"fixtureId":"native-android-workflow","fixtureVersion":"1","candidateRevision":os.environ["GITHUB_SHA"],"scenarioDigest":None,"appBuildDigest":None,"platform":"android","deviceClass":"android-emulator","runtimeVersion":"35","timingMode":"cold-command","runnerVersion":"1.0.0","protocolVersion":"2026-04-28","attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),"host":{"os":"linux","arch":platform.machine(),"class":"github-ubuntu-latest","ci":True},"device":{"requested":"emulator-5554","resolved":None},"toolchain":{"java":"17","zig":os.environ["ZIG_VERSION"]},"artifacts":{"trace":None,"report":None}},sort_keys=True,separators=(",",":")))')"
          python3 scripts/run_evidence.py init \
            --root "$ZMR_RUN_EVIDENCE_ROOT" \
            --index "$ZMR_RUN_EVIDENCE_INDEX" \
            --context-json "$context_json"

      - name: Start Java action evidence
        id: java_setup_start
        run: python3 scripts/run_evidence.py event --root "$ZMR_RUN_EVIDENCE_ROOT" --phase invocation --status started

      - name: Set up Java
        id: java_setup
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Record Java setup outcome
        id: java_setup_close
        if: always()
        env:
          outcome: ${{ steps.java_setup.outcome }}
        run: |
          if [[ "$outcome" == skipped ]]; then exit 0; fi
          failure_code=infra.network
          if [[ "$outcome" == cancelled ]]; then failure_code=run.cancelled; fi
          set +e
          python3 scripts/run_evidence.py external \
            --root "$ZMR_RUN_EVIDENCE_ROOT" --phase invocation \
            --name java_setup --outcome "$outcome" \
            --failure-code "$failure_code" \
            --remediation 'Inspect setup-java and hosted network logs'
          status=$?
          case "$outcome:$status" in success:0|failure:1|cancelled:130) exit 0 ;; *) exit 1 ;; esac

      - name: Install Android toolchain
        id: toolchain_setup
        run: |
          python3 scripts/run_evidence.py command \
            --root "$ZMR_RUN_EVIDENCE_ROOT" --phase invocation \
            --name toolchain_setup --failure-code infra.network -- \
            /bin/bash -c '
              set -euo pipefail
              echo "KERNEL==\"kvm\", GROUP=\"kvm\", MODE=\"0666\", OPTIONS+=\"static_node=kvm\"" | sudo tee /etc/udev/rules.d/99-kvm4all.rules
              sudo udevadm control --reload-rules
              sudo udevadm trigger --name-match=kvm
              case "$(uname -m)" in
                aarch64) zig_arch="aarch64" ;;
                x86_64) zig_arch="x86_64" ;;
                *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
              esac
              curl --fail --location --retry 3 --output zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-${zig_arch}-linux-${ZIG_VERSION}.tar.xz"
              tar -xf zig.tar.xz
              echo "$PWD/zig-${zig_arch}-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
              yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
              "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.1" > /dev/null
            '

      - name: Build zmr
        id: zmr_build
        run: |
          python3 scripts/run_evidence.py command \
            --root "$ZMR_RUN_EVIDENCE_ROOT" --phase invocation \
            --name zmr_build --failure-code config.required_tool_missing -- \
            /bin/bash -c '
              set -euo pipefail
              mkdir -p zig-out/bin
              zig build-exe src/main.zig -target x86_64-linux-gnu -O Debug -femit-bin=zig-out/bin/zmr
              ./zig-out/bin/zmr version --json
            '

      - name: Verify emulator acceleration
        id: device_acquire
        run: |
          python3 scripts/run_evidence.py command \
            --root "$ZMR_RUN_EVIDENCE_ROOT" --phase device.acquire \
            --name device_acquire --failure-code infra.emulator_provision -- \
            /bin/bash -c 'test -r /dev/kvm -a -w /dev/kvm'

      - name: Start Android emulator action evidence
        id: smoke_action_start
        run: python3 scripts/run_evidence.py event --root "$ZMR_RUN_EVIDENCE_ROOT" --phase device.acquire --status started

      - name: Run Android demo smoke on an emulator
        id: smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-snapshot -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: ./scripts/demo-android-real.sh --out /tmp/zmr-android-demo/app --device emulator-5554 --no-auto-boot-emulator --trace-root "$ZMR_RUN_EVIDENCE_ROOT/traces/android-demo"

      - name: Record Android smoke action outcome
        id: smoke_action_close
        if: always()
        env:
          outcome: ${{ steps.smoke.outcome }}
        run: |
          if [[ -f "$ZMR_RUN_EVIDENCE_ROOT/run-summary.json" ]]; then
            python3 scripts/run_evidence.py validate-bundle --root "$ZMR_RUN_EVIDENCE_ROOT"
            exit $?
          fi
          if [[ "$outcome" == skipped ]]; then exit 0; fi
          failure_code=infra.emulator_provision
          if [[ "$outcome" == cancelled ]]; then failure_code=run.cancelled; fi
          set +e
          python3 scripts/run_evidence.py external \
            --root "$ZMR_RUN_EVIDENCE_ROOT" --phase device.acquire \
            --name smoke --outcome "$outcome" \
            --failure-code "$failure_code" \
            --remediation 'Inspect emulator provisioning and Android demo logs'
          status=$?
          case "$outcome:$status" in success:0|failure:1|cancelled:130) exit 0 ;; *) exit 1 ;; esac

      - name: Finalize Android workflow evidence
        id: evidence_finalize
        if: always()
        run: |
          set +e
          ./scripts/finalize-workflow-evidence.sh \
            --root "$ZMR_RUN_EVIDENCE_ROOT" --index "$ZMR_RUN_EVIDENCE_INDEX" \
            --step java_setup:${{ steps.java_setup.outcome }}:invocation:infra.network \
            --step toolchain_setup:${{ steps.toolchain_setup.outcome }}:invocation:infra.network \
            --step zmr_build:${{ steps.zmr_build.outcome }}:invocation:config.required_tool_missing \
            --step device_acquire:${{ steps.device_acquire.outcome }}:device.acquire:infra.emulator_provision \
            --step smoke:${{ steps.smoke.outcome }}:device.acquire:infra.emulator_provision
          finalizer_status=$?
          python3 scripts/run_evidence.py validate-bundle --root "$ZMR_RUN_EVIDENCE_ROOT"
          validation_status=$?
          if [[ "$finalizer_status" -eq 0 && "$validation_status" -eq 0 ]]; then exit 0; fi
          exit 1

      - name: Upload Android run evidence
        id: evidence_upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: device-smoke-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/zmr-android-demo/run-evidence/
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 110
    env:
      ZIG_VERSION: "0.16.0"
      ZMR_RUN_ID: device-smoke-ios-${{ github.run_id }}-${{ github.run_attempt }}
      ZMR_RUN_EVIDENCE_ROOT: /tmp/zmr-ios-demo/run-evidence/attempts/device-smoke-ios-${{ github.run_id }}-${{ github.run_attempt }}
      ZMR_RUN_EVIDENCE_INDEX: /tmp/zmr-ios-demo/run-evidence/attempt-index.json
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Initialize iOS run evidence
        id: evidence_init
        run: |
          mkdir -p /tmp/zmr-ios-demo/run-evidence/attempts
          context_json="$(python3 -c 'import json,os,platform; print(json.dumps({"runId":os.environ["ZMR_RUN_ID"],"executionId":"device-smoke-ios-"+os.environ["GITHUB_RUN_ID"],"fixtureId":"native-ios-workflow","fixtureVersion":"1","candidateRevision":os.environ["GITHUB_SHA"],"scenarioDigest":None,"appBuildDigest":None,"platform":"ios","deviceClass":"ios-simulator","runtimeVersion":None,"timingMode":"cold-command","runnerVersion":"1.0.0","protocolVersion":"2026-04-28","attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),"host":{"os":"macos","arch":platform.machine(),"class":"github-macos-15","ci":True},"device":{"requested":"booted","resolved":None},"toolchain":{"xcode":None,"zig":os.environ["ZIG_VERSION"]},"artifacts":{"trace":None,"report":None}},sort_keys=True,separators=(",",":")))')"
          python3 scripts/run_evidence.py init \
            --root "$ZMR_RUN_EVIDENCE_ROOT" \
            --index "$ZMR_RUN_EVIDENCE_INDEX" \
            --context-json "$context_json"

      - name: Install iOS toolchain helpers
        id: toolchain_setup
        run: |
          python3 scripts/run_evidence.py command \
            --root "$ZMR_RUN_EVIDENCE_ROOT" --phase invocation \
            --name toolchain_setup --failure-code infra.network -- \
            /bin/bash -c '
              set -euo pipefail
              gem install xcodeproj
              case "$(uname -m)" in
                arm64) zig_arch="aarch64" ;;
                x86_64) zig_arch="x86_64" ;;
                *) echo "unsupported macOS architecture: $(uname -m)" >&2; exit 1 ;;
              esac
              curl --fail --location --retry 3 --output zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-${zig_arch}-macos-${ZIG_VERSION}.tar.xz"
              tar -xf zig.tar.xz
              echo "$PWD/zig-${zig_arch}-macos-${ZIG_VERSION}" >> "$GITHUB_PATH"
              xcodebuild -version
            '

      - name: Update iOS toolchain evidence
        id: toolchain_context
        run: |
          xcode_version="$(xcodebuild -version | tr '\n' ' ' | sed 's/ $//')"
          patch="$(python3 -c 'import json,sys; print(json.dumps({"toolchain":{"xcode":sys.argv[1]}},sort_keys=True,separators=(",",":")))' "$xcode_version")"
          python3 scripts/run_evidence.py context --root "$ZMR_RUN_EVIDENCE_ROOT" --set-json "$patch"

      - name: Build zmr
        id: zmr_build
        run: |
          python3 scripts/run_evidence.py command \
            --root "$ZMR_RUN_EVIDENCE_ROOT" --phase invocation \
            --name zmr_build --failure-code config.required_tool_missing -- \
            /bin/bash -c '
              set -euo pipefail
              case "$(uname -m)" in
                arm64) zig_target="aarch64-macos.15.0" ;;
                *) zig_target="x86_64-macos.15.0" ;;
              esac
              mkdir -p zig-out/bin
              zig build-exe src/main.zig -target "$zig_target" -O Debug -femit-bin=zig-out/bin/zmr
              ./zig-out/bin/zmr version --json
            '

      - name: Boot an available iOS simulator
        id: device_acquire
        run: |
          python3 scripts/run_evidence.py command \
            --root "$ZMR_RUN_EVIDENCE_ROOT" --phase device.acquire \
            --name device_acquire --failure-code infra.simulator_provision -- \
            /bin/bash -c '
              set -euo pipefail
              device="$(xcrun simctl list devices available --json | python3 -c "import json,sys; data=json.load(sys.stdin); print(next(device.get(\"udid\") for runtime,devices in data.get(\"devices\",{}).items() if \"iOS\" in runtime for device in devices if device.get(\"isAvailable\",True) and device.get(\"udid\")))")"
              xcrun simctl boot "$device" 2>/dev/null || true
              xcrun simctl bootstatus "$device" -b
              echo "ZMR_IOS_DEVICE=$device" >> "$GITHUB_ENV"
            '

      - name: Update iOS simulator evidence
        id: device_context
        run: |
          runtime_version="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; wanted=sys.argv[1]; data=json.load(sys.stdin); runtime=next(runtime for runtime,devices in data.get("devices",{}).items() if any(device.get("udid")==wanted for device in devices)); print(runtime.rsplit(".iOS-",1)[-1].replace("-","."))' "$ZMR_IOS_DEVICE")"
          patch="$(python3 -c 'import json,sys; print(json.dumps({"runtimeVersion":sys.argv[2],"device":{"resolved":sys.argv[1]}},sort_keys=True,separators=(",",":")))' "$ZMR_IOS_DEVICE" "$runtime_version")"
          python3 scripts/run_evidence.py context --root "$ZMR_RUN_EVIDENCE_ROOT" --set-json "$patch"

      - name: Run iOS demo smoke on the simulator
        id: smoke
        run: ./scripts/demo-ios-real.sh --out /tmp/zmr-ios-demo/app --device "$ZMR_IOS_DEVICE" --no-auto-boot-simulator --trace-root "$ZMR_RUN_EVIDENCE_ROOT/traces/ios-demo" --cleanup-build-products

      - name: Record iOS smoke outcome
        id: smoke_close
        if: always()
        env:
          outcome: ${{ steps.smoke.outcome }}
        run: |
          if [[ -f "$ZMR_RUN_EVIDENCE_ROOT/run-summary.json" ]]; then
            python3 scripts/run_evidence.py validate-bundle --root "$ZMR_RUN_EVIDENCE_ROOT"
            exit $?
          fi
          if [[ "$outcome" == skipped ]]; then exit 0; fi
          failure_code=runner.unclassified
          if [[ "$outcome" == cancelled ]]; then failure_code=run.cancelled; fi
          set +e
          python3 scripts/run_evidence.py external \
            --root "$ZMR_RUN_EVIDENCE_ROOT" --phase scenario.execute \
            --name smoke --outcome "$outcome" \
            --failure-code "$failure_code" \
            --remediation 'Inspect simulator, XCTest shim, and iOS demo logs'
          status=$?
          case "$outcome:$status" in success:0|failure:1|cancelled:130) exit 0 ;; *) exit 1 ;; esac

      - name: Finalize iOS workflow evidence
        id: evidence_finalize
        if: always()
        run: |
          set +e
          ./scripts/finalize-workflow-evidence.sh \
            --root "$ZMR_RUN_EVIDENCE_ROOT" --index "$ZMR_RUN_EVIDENCE_INDEX" \
            --step toolchain_setup:${{ steps.toolchain_setup.outcome }}:invocation:infra.network \
            --step zmr_build:${{ steps.zmr_build.outcome }}:invocation:config.required_tool_missing \
            --step device_acquire:${{ steps.device_acquire.outcome }}:device.acquire:infra.simulator_provision \
            --step smoke:${{ steps.smoke.outcome }}:scenario.execute:runner.unclassified
          finalizer_status=$?
          python3 scripts/run_evidence.py validate-bundle --root "$ZMR_RUN_EVIDENCE_ROOT"
          validation_status=$?
          if [[ "$finalizer_status" -eq 0 && "$validation_status" -eq 0 ]]; then exit 0; fi
          exit 1

      - name: Upload iOS run evidence
        id: evidence_upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: device-smoke-ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/zmr-ios-demo/run-evidence/
          if-no-files-found: error
          retention-days: 14
