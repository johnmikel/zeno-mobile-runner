name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  evidence-node18:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "18.20.8"
      - name: Pin npm compatibility version
        run: npm install --global npm@10.9.8
      - name: Assert minimum toolchain
        run: |
          test "$(node --version)" = "v18.20.8"
          test "$(npm --version)" = "10.9.8"
      - name: Evidence unit and conformance tests
        run: npm run test:evidence
      - name: Packed CLI and Playwright 1.42 smoke
        run: node tests/packed-evidence-smoke.mjs

  test:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      ZIG_VERSION: "0.16.0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: clients/go/go.mod
          cache: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version
      - name: Install tools
        run: |
          brew install kcov
          gem install xcodeproj
          case "$(uname -m)" in
            arm64) zig_arch="aarch64" ;;
            x86_64) zig_arch="x86_64" ;;
            *) echo "unsupported macOS architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -L -o zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-${zig_arch}-macos-${ZIG_VERSION}.tar.xz"
          tar -xf zig.tar.xz
          echo "$PWD/zig-${zig_arch}-macos-${ZIG_VERSION}" >> "$GITHUB_PATH"
          "$PWD/zig-${zig_arch}-macos-${ZIG_VERSION}/zig" version
      - name: Local CI gate
        run: ./scripts/ci-gate.sh
      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zmr-ci-artifacts
          path: |
            traces/
            zig-cache/coverage/
            zig-out/bin/zmr
          if-no-files-found: ignore
          retention-days: 14

  coverage:
    # The 90% floor was never enforced: ci-gate.sh calls coverage.sh, which
    # skips kcov on hosted macOS, and that was the only job running it.
    #
    # It runs here as its own job (so it cannot inflate the main gate) with
    # ZMR_FORCE_KCOV=1 to defeat the skip. macOS, not Linux: kcov reads debug
    # info through libdw and reports 0 instrumented lines against this binary
    # on both Ubuntu 22.04 (elfutils 0.186) and 24.04 (0.190) — it runs the
    # whole suite and measures nothing. kcov on macOS reads it correctly.
    # coverage.sh now treats a 0-line report as a measurement failure, so a
    # blind tool can never be mistaken for a coverage result.
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ZIG_VERSION: "0.16.0"
      ZMR_FORCE_KCOV: "1"
      ZMR_KCOV_TIMEOUT_SECONDS: "1800"
    steps:
      - uses: actions/checkout@v5
      - name: Install Zig
        run: |
          case "$(uname -m)" in
            arm64) zig_arch="aarch64" ;;
            x86_64) zig_arch="x86_64" ;;
            *) echo "unsupported macOS architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -L -o zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-${zig_arch}-macos-${ZIG_VERSION}.tar.xz"
          tar -xf zig.tar.xz
          echo "$PWD/zig-${zig_arch}-macos-${ZIG_VERSION}" >> "$GITHUB_PATH"
          "$PWD/zig-${zig_arch}-macos-${ZIG_VERSION}/zig" version
      - name: Install kcov
        run: |
          brew install kcov
          kcov --version
      - name: Coverage gate
        run: ./scripts/coverage.sh
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zmr-coverage
          path: zig-cache/coverage/kcov
          if-no-files-found: ignore
          retention-days: 14
